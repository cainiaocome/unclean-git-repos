name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false # no external dependencies, so there is no go.sum to cache

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build
